<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>PM Offline</title>

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      color: #1565c0;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      background: #fff3cd;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 80px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .save {
      background: #1565c0;
    }

    .view {
      background: #607d8b;
    }

    .online {
      background: #e8f5e9;
    }

    .offline {
      background: #ffebee;
    }

    #offlineStatus {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>


<body>

<div class="box">

  <h2>ระบบ PM เครื่องจักร</h2>

  <div id="networkStatus" class="status">
    กำลังตรวจสอบ Internet...
  </div>
<button type="button"
        onclick="updateMachineMaster()"
        style="background:#6a1b9a;">
  อัปเดตข้อมูลเครื่องจักร
</button>

<button type="button"
        onclick="testMachineMaster()"
        style="background:#ef6c00;">
  ทดสอบ Machine Master
</button>

<div id="masterStatus"
     style="margin-top:10px;
            text-align:center;
            font-weight:bold;">
</div>

  <label>รหัสเครื่องจักร</label>

  <input id="machineCode"
         placeholder="เช่น EPC-007"
         onchange="findMachineOffline()">


  <label>ชื่อเครื่องจักร</label>

  <input id="machineName"
         placeholder="ชื่อเครื่องจักร">


  <label>แผนก</label>

  <input id="department"
         placeholder="เช่น PW">


  <label>ผู้ตรวจเช็ค</label>

  <input id="inspector"
         placeholder="ชื่อผู้ตรวจเช็ค">


  <label>ความถี่ในการ PM</label>

  <select id="frequency">
    <option value="">-- เลือก --</option>
    <option>1 เดือน</option>
    <option>3 เดือน</option>
    <option>6 เดือน</option>
    <option>1 ปี</option>
  </select>


  <label>สรุปผลการ PM</label>

  <select id="pmResult">
    <option value="">-- เลือก --</option>
    <option>ปกติ</option>
    <option>ผิดปกติ</option>
  </select>


  <label>สรุปปัญหา</label>

  <select id="problemSummary">
    <option value="">-- เลือก --</option>
    <option>ไม่พบปัญหา</option>
    <option>พบปัญหา</option>
  </select>


  <label>ปัญหาที่พบ</label>

  <textarea id="problem"></textarea>


  <label>ระดับความเร่งด่วน</label>

  <select id="urgency">
    <option value="">-- เลือก --</option>
    <option>ต่ำ</option>
    <option>ปานกลาง</option>
    <option>สูง</option>
    <option>เร่งด่วน</option>
  </select>


  <label>รายละเอียดการแก้ไข</label>

  <textarea id="solution"></textarea>


  <button class="save"
          onclick="saveOffline()">
    บันทึก Offline
  </button>


  <button class="view"
          onclick="showOfflineData()">
    ดูข้อมูลที่รอ Sync
  </button>


  <div id="offlineStatus">
  </div>

</div>


<script>

// =============================================
// ตรวจสถานะ Internet
// =============================================

function updateNetworkStatus() {

  const box =
    document.getElementById("networkStatus");

  if (navigator.onLine) {

    box.innerHTML =
      "● Online - เชื่อมต่อ Internet";

    box.className =
      "status online";

  } else {

    box.innerHTML =
      "● Offline - ไม่มี Internet";

    box.className =
      "status offline";
  }
}


window.addEventListener(
  "online",
  updateNetworkStatus
);

window.addEventListener(
  "offline",
  updateNetworkStatus
);


// =============================================
// อ่าน Machine Master ที่มีในเครื่อง
// =============================================

function findMachineOffline() {

  const codeInput =
    document.getElementById("machineCode");

  const machineNameInput =
    document.getElementById("machineName");

  const departmentInput =
    document.getElementById("department");

  const frequencyInput =
    document.getElementById("frequency");


  // ------------------------------
  // รหัสที่รับมาจาก QR / ผู้ใช้งาน
  // ------------------------------
  const code =
    String(codeInput.value || "")
      .trim()
      .toUpperCase();


  if (!code) {
    return;
  }


  // ------------------------------
  // อ่าน Machine Master ในเครื่อง
  // ------------------------------
  let machines = [];

  try {

    machines =
      JSON.parse(
        localStorage.getItem(
          "PM_MACHINE_MASTER"
        ) || "[]"
      );

  } catch (error) {

    alert(
      "Machine Master ในอุปกรณ์มีปัญหา\n" +
      error.message
    );

    return;
  }


  if (!Array.isArray(machines) ||
      machines.length === 0) {

    alert(
      "ยังไม่มี Machine Master ในอุปกรณ์\n\n" +
      "กรุณาต่อ Internet แล้วกด " +
      "'อัปเดตข้อมูลเครื่องจักร'"
    );

    return;
  }


  // ------------------------------
  // ทำรหัสให้เป็นรูปแบบเดียวกัน
  // EPC-007 / EPC007 / EPC 007
  // จะถือเป็นรหัสเดียวกัน
  // ------------------------------
  function normalizeCode(value) {

    return String(value || "")
      .trim()
      .toUpperCase()
      .replace(/[\s-]/g, "");

  }


  const searchCode =
    normalizeCode(code);


  // ------------------------------
  // ค้นหาเครื่องจักร
  // ------------------------------
  const machine =
    machines.find(function(item) {

      return normalizeCode(item.code) ===
             searchCode;

    });


  if (!machine) {

    alert(
      "ไม่พบรหัสเครื่องจักร: " +
      code +
      "\n\nMachine Master มี " +
      machines.length +
      " รายการ"
    );

    return;
  }


  // ------------------------------
  // เติมข้อมูล
  // ------------------------------
  codeInput.value =
    machine.code || code;

  machineNameInput.value =
    machine.name || "";

  departmentInput.value =
    machine.dept || "";


  // ------------------------------
  // ความถี่ PM
  // ------------------------------
  const frequency =
    String(
      machine.frequency || ""
    ).trim();


  if (frequency) {

    // ถ้า option นี้ยังไม่มี ให้เพิ่มให้อัตโนมัติ
    const optionExists =
      Array.from(
        frequencyInput.options
      ).some(function(option) {

        return option.value === frequency;

      });


    if (!optionExists) {

      const newOption =
        document.createElement("option");

      newOption.value =
        frequency;

      newOption.textContent =
        frequency;

      frequencyInput.appendChild(
        newOption
      );
    }


    frequencyInput.value =
      frequency;
  }


  // ------------------------------
  // แสดงสถานะ
  // ------------------------------
  const status =
    document.getElementById(
      "masterStatus"
    );


  if (status) {

    status.innerHTML =
      "✓ พบข้อมูล " +
      machine.code +
      " | " +
      machine.dept +
      " | " +
      frequency;
  }
}

// =============================================
// ดูรายการรอ Sync
// =============================================

function showOfflineData() {

  const offlineData =
    JSON.parse(
      localStorage.getItem(
        "PM_OFFLINE_DATA"
      ) || "[]"
    );


  if (offlineData.length === 0) {

    alert(
      "ไม่มีข้อมูลรอ Sync"
    );

    return;
  }


  let message =
    "ข้อมูลรอ Sync: " +
    offlineData.length +
    " รายการ\n\n";


  offlineData.forEach(
    function(item, index) {

      message +=
        (index + 1) +
        ". " +
        item.machineCode +
        "\n" +
        item.dateTime +
        "\n\n";
    }
  );


  alert(message);
}


// =============================================
// จำนวนรายการรอ Sync
// =============================================

function updateOfflineCount() {

  const offlineData =
    JSON.parse(
      localStorage.getItem(
        "PM_OFFLINE_DATA"
      ) || "[]"
    );


  document.getElementById(
    "offlineStatus"
  ).innerHTML =

    "ข้อมูลรอ Sync: " +
    offlineData.length +
    " รายการ";
}


// =============================================
// เริ่มต้นระบบ
// =============================================

window.onload = function() {

  updateNetworkStatus();
  updateOfflineCount();

  // รับรหัสเครื่องจักรจาก QR
  const params =
    new URLSearchParams(window.location.search);

  const machineCode =
    params.get("code");

  if (machineCode) {

    const code =
      machineCode
        .trim()
        .toUpperCase();

    document.getElementById(
      "machineCode"
    ).value = code;

    // รอให้หน้า Form พร้อมก่อน แล้วค้นหา Master
    setTimeout(function() {

      findMachineOffline();

    }, 1000);
  }
};

  // ==========================================
  // รับรหัสเครื่องจักรจาก QR Code
  // ตัวอย่าง ?code=EPC-007
  // ==========================================

  const params =
    new URLSearchParams(
      window.location.search
    );

  const machineCode =
    params.get("code");


  if (machineCode) {

    const code =
      machineCode
        .trim()
        .toUpperCase();


    // ใส่รหัสลงในช่อง
    document.getElementById(
      "machineCode"
    ).value = code;


    // ค้นข้อมูลจาก Machine Master
    findMachineOffline();
  }
};
// =============================================
// อัปเดต Machine Master จาก PM Schedule
// =============================================

async function updateMachineMaster() {

  if (!navigator.onLine) {

    alert(
      "ไม่มี Internet\n\n" +
      "กรุณาเชื่อมต่อ Internet ก่อนอัปเดตข้อมูลเครื่องจักร"
    );

    return;
  }


  const status =
    document.getElementById("masterStatus");

  status.innerHTML =
    "กำลังดาวน์โหลดข้อมูลเครื่องจักร...";


  try {

    // URL ของ Google Apps Script Web App
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyUxh4XXPWNY05erqCN9cwpJCoT52YtBzQ5aPzMvyTL7yZXmWRNMuxxE6RlOnB8L68wyw/exec?action=machines"
;


    const response =
      await fetch(API_URL);


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );
    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "ไม่สามารถโหลด Machine Master ได้"
      );
    }


    // บันทึก Machine Master ลงในอุปกรณ์
    localStorage.setItem(
      "PM_MACHINE_MASTER",
      JSON.stringify(result.machines)
    );


    // บันทึกวันเวลาที่อัปเดต
    const updateTime =
      new Date().toLocaleString("th-TH");


    localStorage.setItem(
      "PM_MACHINE_MASTER_UPDATE",
      updateTime
    );


    status.innerHTML =
      "ข้อมูลเครื่องจักร: " +
      result.count +
      " รายการ | อัปเดต " +
      updateTime;


    alert(
      "อัปเดตข้อมูลเครื่องจักรสำเร็จ\n\n" +
      "จำนวน: " +
      result.count +
      " รายการ"
    );


  } catch (error) {

    status.innerHTML =
      "อัปเดตข้อมูลเครื่องจักรไม่สำเร็จ";


    alert(
      "ไม่สามารถอัปเดต Machine Master\n\n" +
      error.message
    );
  }
}
function testMachineMaster() {

  const raw =
    localStorage.getItem("PM_MACHINE_MASTER");

  if (!raw) {
    alert("ไม่พบ PM_MACHINE_MASTER ในเครื่อง");
    return;
  }

  try {

    const machines =
      JSON.parse(raw);

    const epc007 =
      machines.find(function(item) {

        return String(item.code || "")
          .trim()
          .toUpperCase()
          .replace(/[\s-]/g, "") === "EPC007";

      });


    if (!epc007) {

      alert(
        "มี Machine Master " +
        machines.length +
        " รายการ\n\n" +
        "แต่ค้นหา EPC-007 ไม่พบ"
      );

      return;
    }


    alert(
      "พบ EPC-007 แล้ว\n\n" +
      "จำนวน Master: " +
      machines.length +
      "\n\n" +
      "Code: " +
      epc007.code +
      "\n" +
      "Name: " +
      epc007.name +
      "\n" +
      "Dept: " +
      epc007.dept +
      "\n" +
      "Frequency: " +
      epc007.frequency
    );

  } catch (error) {

    alert(
      "อ่าน Machine Master ไม่สำเร็จ\n\n" +
      error.message
    );
  }
}
// =============================================
// Service Worker
// =============================================

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./service-worker.js")
        .catch(function(error) {

          console.log(
            "Service Worker Error:",
            error
          );

        });

    }
  );
}

</script>

</body>
</html>
